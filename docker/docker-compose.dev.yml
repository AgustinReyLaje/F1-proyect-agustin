# Docker Compose para Desarrollo (con hot reload)

services:
  db:
    image: postgres:15-alpine
    container_name: f1_analytics_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-f1_analytics_db}
      POSTGRES_USER: ${POSTGRES_USER:-f1_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-f1_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - f1_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-f1_user} -d ${POSTGRES_DB:-f1_analytics_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: f1_analytics_backend_dev
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ../backend:/app
      - logs_volume_dev:/app/logs
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-not-for-production}
      - DB_NAME=${POSTGRES_DB:-f1_analytics_db}
      - DB_USER=${POSTGRES_USER:-f1_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-f1_dev_password}
      - DB_HOST=db
      - DB_PORT=5432
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/seasons/', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - f1_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: f1_analytics_frontend_dev
    restart: unless-stopped
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_API_URL_SERVER=http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - f1_network
    stdin_open: true
    tty: true

volumes:
  postgres_data_dev:
  logs_volume_dev:

networks:
  f1_network:
    driver: bridge
